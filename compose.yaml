services:
  mysql:
    image: mysql:8.0
    container_name: nexgtools-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change_this_local_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextgtools}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - nexgtools_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  nexgtools_mysql_data:
    name: nexgtools_mysql_data
